name: instagram-only
on:
  workflow_dispatch:          # run by hand from the Actions tab
jobs:
  instagram:
    runs-on: ubuntu-latest
    timeout-minutes: 350      # paced collection can take a few hours
    concurrency: instagram-api   # never runs at the same time as another Instagram job
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m ingest.instagram