name: find-missing-inst_only
on:
  workflow_dispatch:          # run by hand from the Actions tab
jobs:
  find-missing:
    runs-on: ubuntu-latest
    timeout-minutes: 350        # long runs can take a few hours
    concurrency: instagram-api  # never runs at the same time as an Instagram collection
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      AI_FALLBACK: none
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m build.find_missing_ai
      - run: python -m build.find_instagram
      - run: python -m build.verify_ai