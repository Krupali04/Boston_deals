name: websites-daily
on:
  workflow_dispatch:          # also lets you run it anytime from the Actions tab
jobs:
  websites:
    runs-on: ubuntu-latest
    timeout-minutes: 180        # expected 1–2 hours; stops a stuck run after 3
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m ingest.websites